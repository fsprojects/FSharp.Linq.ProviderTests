name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Only the Linux job has an emulator: the vNext emulator runs in Docker. The Windows runner skips the test
      - name: Start the Azure Cosmos DB Emulator
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./.github/scripts/start-cosmos-emulator.ps1

      - name: Wait for the Azure Cosmos DB Emulator
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-cosmos-emulator

      - name: Test the providers
        run: dotnet test tests/ProviderTests/FSharp.Linq.ProviderTests.fsproj -c Release
        env:
          # On Linux a missing emulator is an error, not a skipped test
          COSMOS_EMULATOR_REQUIRED: ${{ runner.os == 'Linux' && '1' || '' }}

      - name: Test SQLProvider
        run: dotnet test tests/SQLProviderTests/FSharp.Linq.ProviderTests.SQLProvider.fsproj -c Release

      # What each provider did with every query, in the format of the baselines: the way to get a new baseline
      - name: Upload what the providers did
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-${{ matrix.os }}
          path: artifacts/actual/*.tsv
          if-no-files-found: warn

  # The providers that need a server in a container. Service containers run on Linux runners only; the job above
  # skips these tests. The addresses and passwords are the defaults of the tests
  servers:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: FSharp-Linq-1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P FSharp-Linq-1 -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 20

      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fsharp-linq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20

      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test the providers on servers
        run: >-
          dotnet test tests/ProviderTests/FSharp.Linq.ProviderTests.fsproj -c Release
          --filter "FullyQualifiedName~FSharp.Linq.ProviderTests.ServerTests"
        env:
          # A server that does not answer is an error here, not a skipped test
          SQLSERVER_REQUIRED: '1'
          POSTGRESQL_REQUIRED: '1'
          MONGODB_REQUIRED: '1'

      - name: Upload what the providers did
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-servers
          path: artifacts/actual/*.tsv
          if-no-files-found: warn
